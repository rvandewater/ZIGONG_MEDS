# The complete Zigong Fourth People's Hospital ICU infection database (PhysioNet v1.1) MEDS ETL.
# This one file *is* the package: `sources:` says where the raw data comes from, `etl:` supplies
# the run knobs, and every other top-level key is a raw table whose events are extracted from it.
# It is registered with `meds-extract-run` under the name `Zigong` (see this repo's
# `pyproject.toml`), so the whole ETL is one command:
#
#     meds-extract-run spec=Zigong output_dir=$MEDS_OUTPUT_DIR
#
# Conventions used throughout:
#
# - All source times are deidentified hours from hospital admission. 1970-01-01 is a pseudotime
#   anchor: it preserves ordering and intervals without asserting a real calendar date. Every
#   patient has exactly one admission in v1.1, so per-admission offsets never collide.
# - The release was written by R's write.csv: a missing value is the bare string NA, and missing
#   text in several dtNursingChart and dtLab columns is a quoted empty string. Neither is read as
#   null, so every code and text value below guards against both. Free-text nursing fields also
#   require a word character, which drops whitespace-, DEL- and punctuation-only entries.
# - Codes keep the source's own vocabulary. No standard-terminology parent is claimed where the
#   release does not document one.
# - Every event describes its codes in `metadata/codes.parquet` through a `_metadata: _self:`
#   block: a template over the event's own columns that names the source column it came from.
#   The release ships no code dictionary, so the templates restate the column meaning given by the
#   column names and the PhysioNet documentation (see the README, "Code metadata").
# - `_self` metadata attaches through the columns a code expression references, so a bare literal
#   code cannot carry it. The four fixed codes (HOSPITAL_ADMISSION, ICU_DISCHARGE,
#   HOSPITAL_DISCHARGE, MEDS_DEATH) are therefore written as `"CODE" if $PATIENT_ID == $PATIENT_ID`.
#   This drops nothing: a row without a subject id never reaches extraction.

etl:
  # `meds-extract-run` defaults the dataset name to the registered entry-point name; this fallback
  # makes the spec self-describing when it is resolved by `pkg://` reference or filesystem path.
  dataset_name: Zigong
  n_subjects_per_shard: 1000

_defaults:
  subject_id: $PATIENT_ID

dtBaseline:
  hospital_admission:
    code: '"HOSPITAL_ADMISSION" if $PATIENT_ID == $PATIENT_ID'
    time: 1970-01-01 @ 00:00
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Hospital admission; the pseudotime anchor, 1970-01-01 00:00 is admission (dtBaseline)"
  age_at_admission:
    code: '"AGE_AT_ADMISSION" if $Age::?float64 >= 0'
    time: 1970-01-01 @ 00:00
    numeric_value: $Age::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Age at hospital admission in years (dtBaseline.Age; ages above 89 were replaced by random values
          from 90 to 120 for deidentification)"
  sex:
    code: f"SEX//{$SEX}"
    time: 1970-01-01 @ 00:00
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Sex: {$SEX} (dtBaseline.SEX)"
  admission_department:
    code: f"ADMISSION_DEPARTMENT//{$AdmitDept}"
    time: 1970-01-01 @ 00:00
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Hospital department at admission: {$AdmitDept} (dtBaseline.AdmitDept)"
  infection_site:
    code: f"INFECTION_SITE//{$InfectionSite}"
    time: 1970-01-01 @ 00:00
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Infection site category: {$InfectionSite} (dtBaseline.InfectionSite)"
  icu_discharge:
    code: '"ICU_DISCHARGE" if $PATIENT_ID == $PATIENT_ID'
    time: "(1970-01-01 @ 00:00) + $ICU_discharge_time::hours"
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Discharge from the ICU (dtBaseline.ICU_discharge_time)"
  hospital_discharge:
    code: '"HOSPITAL_DISCHARGE" if $PATIENT_ID == $PATIENT_ID'
    time: "(1970-01-01 @ 00:00) + $DISCHARGE_DATE_TIME::hours"
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Discharge from the hospital (dtBaseline.DISCHARGE_DATE_TIME)"

dtDrugs:
  # dtDrugs has no INP_NO; with one admission per patient the stay is recovered from dtBaseline.
  _table:
    join:
      dtBaseline:
        key: PATIENT_ID
        cols: [INP_NO]
  prescription:
    code: f"MEDICATION//{$DrugName}"
    time: "(1970-01-01 @ 00:00) + $Drug_time::hours"
    text_value: $Formula
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Medication order: {$DrugName} (dtDrugs.DrugName; timed at prescription, not necessarily at
          administration)"

dtICD:
  _table:
    join:
      dtBaseline:
        key: INP_NO
        cols: [DISCHARGE_DATE_TIME]
  diagnosis:
    code: 'f"DIAGNOSIS//ICD//{$ICD_Code}" if $ICD_Code != "NA"'
    time: "(1970-01-01 @ 00:00) + $DISCHARGE_DATE_TIME::hours"
    # ICD_desc is the clinician's free-text diagnosis, not the code's title: most codes carry
    # several distinct descriptions, so it stays per-event and is not used as code metadata.
    text_value: $ICD_desc
    diagnosis_sequence: $Diagnosis_seq
    discharge_diagnosis_status: '$Status_Discharge if $Status_Discharge != "NA"'
    inpatient_stay_id: $INP_NO
    # The codes are ICD-10 in the Chinese national clinical extension (`J18.900`, `A41.900x001`,
    # `I10.x01`, morphology `M80000/3`), the code format of OMOP's ICD10CN vocabulary (OHDSI
    # Vocabulary-v5.0, ICD10CN/load_stage.sql), so each well-formed code is its own `ICD10CN/` parent
    # and vocabulary tooling resolves its title. Two spellings are normalized to that format: an
    # upper-case extension marker `X` becomes `x`, and a trailing dagger `+` is dropped. Dagger and
    # asterisk pairs (`A00.000+B00.0*`) and other shapes get no parent.
    _metadata:
      _self:
        description: >-
          f"Diagnosis, ICD-10 (Chinese edition) code {$ICD_Code} (dtICD.ICD_Code)"
        parent_codes: >-
          f"ICD10CN/{$ICD_Code[0:7]}" if /^[A-Z]\d{2}\.\d{3}\+?$/ in $ICD_Code
          else f"ICD10CN/{$ICD_Code[0:7]}x{$ICD_Code[8:11]}" if /^[A-Z]\d{2}\.\d{3}[xX]\d{3}\+?$/ in $ICD_Code
          else f"ICD10CN/{$ICD_Code[0:4]}x{$ICD_Code[5:7]}x{$ICD_Code[8:11]}"
          if /^[A-Z]\d{2}\.[xX]\d{2}[xX]\d{3}\+?$/ in $ICD_Code
          else f"ICD10CN/{$ICD_Code[0:4]}x{$ICD_Code[5:7]}" if /^[A-Z]\d{2}\.[xX]\d{2}\+?$/ in $ICD_Code
          else f"ICD10CN/{$ICD_Code}" if /^M\d{5}\/\d$/ in $ICD_Code

dtLab:
  _table:
    join:
      dtBaseline:
        key: INP_NO
        cols: [PATIENT_ID, DISCHARGE_DATE_TIME]
  # Results timed after hospital discharge (~0.3% of rows) are dropped; pre-admission results
  # (down to about -24 h) are kept. Placeholder values made only of dots or asterisks (".....",
  # "****") carry no result and are dropped.
  lab_result:
    code: >-
      f"LAB//{$Category}//{$Item}//{$Unit if $Unit != '' else 'UNK'}"
      if /[^.*\s]/ in $LabValue::str
    time: "(1970-01-01 @ 00:00) + $LabTime::hours if $LabTime <= $DISCHARGE_DATE_TIME"
    numeric_value: $LabValue::?float64
    text_value: $LabValue
    reference_range: '$Ref if $Ref != ""'
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Lab result: {$Item} (category {$Category}), unit {$Unit if $Unit != '' else 'not recorded'}
          (dtLab.Item, Category, Unit)"

dtTransfer:
  transfer_start:
    code: f"TRANSFER_TO//{$TransferDept}"
    time: "(1970-01-01 @ 00:00) + $StartTime::hours"
    transfer_reason: $StartReason
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Transfer into department {$TransferDept} (dtTransfer.TransferDept, at StartTime)"
  transfer_end:
    code: f"TRANSFER_FROM//{$TransferDept}"
    time: "(1970-01-01 @ 00:00) + $StopTime::hours"
    transfer_reason: $StopReason
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          f"Transfer out of department {$TransferDept} (dtTransfer.TransferDept, at StopTime)"

# Every row with ChartTime = NA belongs to a stay that is not in dtBaseline, so the inner join
# drops them. Chart times more than 24 h before admission (including some corrupt offsets of
# millions of hours) or after discharge are dropped too. Several columns are not mapped: Rhythm,
# Lower_extremity_blood_pressure_monitoring, Left/Right_pupil_reflex and ETCO2 are NA in every
# row; MAP, PSIPAP, R and FIO2 hold only unit strings; Invasive_SBP._1 is a documented technical
# duplicate; F is documented as having no clinical relevance.
dtNursingChart:
  _table:
    join:
      dtBaseline:
        key: INP_NO
        cols: [PATIENT_ID, DISCHARGE_DATE_TIME]
    cols:
      chart_time: >-
        (1970-01-01 @ 00:00) + $ChartTime::?float64::hours
        if $ChartTime::?float64 >= -24 and $ChartTime::?float64 <= $DISCHARGE_DATE_TIME
  # The six vital signs below carry the LOINC code that the HL7 FHIR R4 vital-signs profile
  # (https://hl7.org/fhir/R4/observation-vitalsigns.html, CC0) assigns them as a parent.
  temperature:
    code: '"NURSING//TEMPERATURE" if $temperature::?float64 >= 0'
    time: $chart_time
    numeric_value: $temperature::?float64
    unit: degC
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Body temperature, degC (dtNursingChart.temperature)"
        parent_codes: >-
          "LOINC/8310-5"
  heart_rate:
    code: '"NURSING//HEART_RATE" if $heart_rate::?float64 >= 0'
    time: $chart_time
    numeric_value: $heart_rate::?float64
    unit: "'/min'"
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Heart rate, /min (dtNursingChart.heart_rate)"
        parent_codes: >-
          "LOINC/8867-4"
  respiratory_rate:
    code: '"NURSING//RESPIRATORY_RATE" if $breathing::?float64 >= 0'
    time: $chart_time
    numeric_value: $breathing::?float64
    unit: "'/min'"
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Respiratory rate, /min (dtNursingChart.breathing)"
        parent_codes: >-
          "LOINC/9279-1"
  oxygen_saturation:
    code: '"NURSING//OXYGEN_SATURATION" if $Blood_oxygen_saturation::?float64 >= 0'
    time: $chart_time
    numeric_value: $Blood_oxygen_saturation::?float64
    unit: '"%"'
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Blood oxygen saturation, % (dtNursingChart.Blood_oxygen_saturation)"
        parent_codes: >-
          "LOINC/2708-6"
  systolic_blood_pressure:
    code: '"NURSING//SYSTOLIC_BLOOD_PRESSURE" if $Blood_pressure_high::?float64 >= 0'
    time: $chart_time
    numeric_value: $Blood_pressure_high::?float64
    unit: mmHg
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Systolic blood pressure, mmHg (dtNursingChart.Blood_pressure_high)"
        parent_codes: >-
          "LOINC/8480-6"
  diastolic_blood_pressure:
    code: '"NURSING//DIASTOLIC_BLOOD_PRESSURE" if $Blood_pressure_low::?float64 >= 0'
    time: $chart_time
    numeric_value: $Blood_pressure_low::?float64
    unit: mmHg
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Diastolic blood pressure, mmHg (dtNursingChart.Blood_pressure_low)"
        parent_codes: >-
          "LOINC/8462-4"
  invasive_systolic_blood_pressure:
    code: '"NURSING//INVASIVE_SYSTOLIC_BLOOD_PRESSURE" if $Invasive_SBP::?float64 >= 0'
    time: $chart_time
    numeric_value: $Invasive_SBP::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Invasive systolic blood pressure (dtNursingChart.Invasive_SBP)"
  invasive_diastolic_blood_pressure:
    code: '"NURSING//INVASIVE_DIASTOLIC_BLOOD_PRESSURE" if $Invasive_diastolic_blood_pressure::?float64 >= 0'
    time: $chart_time
    numeric_value: $Invasive_diastolic_blood_pressure::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Invasive diastolic blood pressure (dtNursingChart.Invasive_diastolic_blood_pressure)"
  central_venous_pressure:
    code: '"NURSING//CENTRAL_VENOUS_PRESSURE" if $Central_venous_pressure::?float64 >= 0'
    time: $chart_time
    numeric_value: $Central_venous_pressure::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Central venous pressure (dtNursingChart.Central_venous_pressure)"
  blood_sugar:
    code: '"NURSING//BLOOD_SUGAR" if $blood_sugar::?float64 >= 0'
    time: $chart_time
    numeric_value: $blood_sugar::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Blood glucose charted by nursing (dtNursingChart.blood_sugar)"
  oxygen_inhalation_mode:
    code: '"NURSING//OXYGEN_INHALATION_MODE" if $Oxygen_inhalation_mode != "NA" and /\w/ in $Oxygen_inhalation_mode'
    time: $chart_time
    text_value: $Oxygen_inhalation_mode
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Oxygen inhalation mode, charted text (dtNursingChart.Oxygen_inhalation_mode)"
  oxygen_flow:
    code: '"NURSING//OXYGEN_FLOW" if $Oxygen_flow::?float64 >= 0'
    time: $chart_time
    numeric_value: $Oxygen_flow::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Oxygen flow (dtNursingChart.Oxygen_flow)"
  ventilation_mode:
    code: '"NURSING//VENTILATION_MODE" if $Breathing_pattern != "NA" and /\w/ in $Breathing_pattern'
    time: $chart_time
    text_value: $Breathing_pattern
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Ventilation mode, charted text (dtNursingChart.Breathing_pattern)"
  tidal_volume_setting:
    code: '"NURSING//TIDAL_VOLUME_SETTING" if $Vt_setting::?float64 >= 0'
    time: $chart_time
    numeric_value: $Vt_setting::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Tidal volume setting (dtNursingChart.Vt_setting)"
  monitored_tidal_volume:
    code: '"NURSING//MONITORED_TIDAL_VOLUME" if $Vt_Supervisor::?float64 >= 0'
    time: $chart_time
    numeric_value: $Vt_Supervisor::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Monitored tidal volume (dtNursingChart.Vt_Supervisor)"
  consciousness:
    code: '"NURSING//CONSCIOUSNESS" if $consciousness != "NA" and /\w/ in $consciousness'
    time: $chart_time
    text_value: $consciousness
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Level of consciousness, charted text (dtNursingChart.consciousness)"
  left_pupil_size:
    code: '"NURSING//LEFT_PUPIL_SIZE" if $Left_pupil_size::?float64 >= 0'
    time: $chart_time
    numeric_value: $Left_pupil_size::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Left pupil size (dtNursingChart.Left_pupil_size)"
  right_pupil_size:
    code: '"NURSING//RIGHT_PUPIL_SIZE" if $Right_pupil_size::?float64 >= 0'
    time: $chart_time
    numeric_value: $Right_pupil_size::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Right pupil size (dtNursingChart.Right_pupil_size)"
  # GCS components are charted as "<score>→<Chinese label>", e.g. "3→呼唤睁眼". The leading score
  # is the numeric_value; non-scorable entries ("T" intubated, "S" motor disorder) keep only the
  # text.
  gcs_eye_response:
    code: '"NURSING//GCS_EYE_RESPONSE" if $`open_one''s_eyes` != "NA" and /\w/ in $`open_one''s_eyes`'
    time: $chart_time
    numeric_value: '(extract group 1 of /^\s*([1-4])\s*[^\d\s]/ from $`open_one''s_eyes`)::?float64'
    text_value: $`open_one's_eyes`
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Glasgow Coma Scale eye response; score 1-4 as numeric value, charted label as text
          (dtNursingChart.open_one's_eyes)"
  gcs_motor_response:
    code: '"NURSING//GCS_MOTOR_RESPONSE" if $motion != "NA" and /\w/ in $motion'
    time: $chart_time
    numeric_value: '(extract group 1 of /^\s*([1-6])\s*[^\d\s]/ from $motion)::?float64'
    text_value: $motion
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Glasgow Coma Scale motor response; score 1-6 as numeric value, charted label as text
          (dtNursingChart.motion)"
  gcs_verbal_response:
    code: '"NURSING//GCS_VERBAL_RESPONSE" if $language != "NA" and /\w/ in $language'
    time: $chart_time
    numeric_value: '(extract group 1 of /^\s*([1-5])\s*[^\d\s]/ from $language)::?float64'
    text_value: $language
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Glasgow Coma Scale verbal response; score 1-5 as numeric value, charted label as text
          (dtNursingChart.language)"
  # Line and tube columns hold the charted length in cm, or a status such as "拔除" (removed) or
  # "不详" (unknown); the length is the numeric_value and the raw entry stays in text_value. The
  # `::str` casts keep the text guards valid whichever dtype the column is inferred as.
  cvc:
    code: '"NURSING//CVC" if $CVC::str != "NA" and /\w/ in $CVC::str'
    time: $chart_time
    numeric_value: $CVC::?float64
    text_value: $CVC::str
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Central venous catheter (CVC); charted length in cm, or a status as text (dtNursingChart.CVC)"
  picc:
    code: '"NURSING//PICC" if $PICC::str != "NA" and /\w/ in $PICC::str'
    time: $chart_time
    numeric_value: $PICC::?float64
    text_value: $PICC::str
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Peripherally inserted central catheter (PICC); charted length in cm, or a status as text
          (dtNursingChart.PICC)"
  # Every numeric Endotracheal_intubation value equals Endotracheal_intubation_Depth on the same
  # row, so only its non-numeric statuses (e.g. "拔除", removed) are emitted here; the depth is
  # emitted by endotracheal_intubation_depth below.
  endotracheal_intubation:
    code: >-
      "NURSING//ENDOTRACHEAL_INTUBATION"
      if $Endotracheal_intubation::str != "NA" and /\w/ in $Endotracheal_intubation::str
      and /[^0-9.\s]/ in $Endotracheal_intubation::str
    time: $chart_time
    text_value: $Endotracheal_intubation::str
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Endotracheal intubation status, charted text (dtNursingChart.Endotracheal_intubation)"
  gastric_tube:
    code: '"NURSING//GASTRIC_TUBE" if $Gastric_tube::str != "NA" and /\w/ in $Gastric_tube::str'
    time: $chart_time
    numeric_value: $Gastric_tube::?float64
    text_value: $Gastric_tube::str
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Gastric tube; charted length in cm, or a status as text (dtNursingChart.Gastric_tube)"
  medium_length_catheter:
    code: '"NURSING//MEDIUM_LENGTH_CATHETER" if $Medium_length_catheter::str != "NA" and /\w/ in $Medium_length_catheter::str'
    time: $chart_time
    numeric_value: $Medium_length_catheter::?float64
    text_value: $Medium_length_catheter::str
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Medium-length catheter; charted length in cm, or a status as text
          (dtNursingChart.Medium_length_catheter)"
  hemodialysis_tube:
    code: '"NURSING//HEMODIALYSIS_TUBE" if $Hemodialysis_tube::str != "NA" and /\w/ in $Hemodialysis_tube::str'
    time: $chart_time
    numeric_value: $Hemodialysis_tube::?float64
    text_value: $Hemodialysis_tube::str
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Hemodialysis tube; charted length in cm, or a status as text (dtNursingChart.Hemodialysis_tube)"
  basic_nursing:
    code: '"NURSING//BASIC_NURSING" if $basic_nursing != "NA" and /\w/ in $basic_nursing'
    time: $chart_time
    text_value: $basic_nursing
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Basic nursing care, charted text (dtNursingChart.basic_nursing)"
  skin_care:
    code: '"NURSING//SKIN_CARE" if $Skin_care != "NA" and /\w/ in $Skin_care'
    time: $chart_time
    text_value: $Skin_care
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Skin care, charted text (dtNursingChart.Skin_care)"
  acral_circulation:
    code: '"NURSING//ACRAL_CIRCULATION" if $Acral_circulation != "NA" and /\w/ in $Acral_circulation'
    time: $chart_time
    text_value: $Acral_circulation
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Acral circulation, charted text (dtNursingChart.Acral_circulation)"
  pressure_ulcer_risk:
    code: '"NURSING//PRESSURE_ULCER_RISK" if $Pressure_ulcer_risk_assessment::?float64 >= 0'
    time: $chart_time
    numeric_value: $Pressure_ulcer_risk_assessment::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Pressure ulcer risk assessment score (dtNursingChart.Pressure_ulcer_risk_assessment)"
  catheter_drop_risk:
    code: '"NURSING//CATHETER_DROP_RISK" if $Catheter_drop_assessment::?float64 >= 0'
    time: $chart_time
    numeric_value: $Catheter_drop_assessment::?float64
    inpatient_stay_id: $INP_NO
    _metadata:
      _self:
        description: >-
          "Catheter drop (dislodgement) risk assessment score (dtNursingChart.Catheter_drop_assessment)"
  fall_risk:
