  cvc:
    code: '"NURSING//CVC" if $CVC != "NA"'
    time: $chart_time
    text_value: $CVC
    inpatient_stay_id: $INP_NO
  picc:
    code: '"NURSING//PICC" if $PICC != "NA"'
