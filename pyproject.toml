[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Zigong-MEDS"
# Bump with `uv version --bump patch|minor|major`, then tag the commit with the same version.
version = "0.3.0"
authors = [
  { name="Robin van de Water", email="rpv2114@cumc.columbia.edu" },
]
description = "An ETL pipeline to extract the Zigong Fourth People's Hospital ICU infection database into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.7's own interpreter range; a looser range here admits interpreters it
# cannot be installed on.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# This package ships no Python: the whole ETL is `event_configs.yaml`, run by
# MEDS-Extract's own `meds-extract-run`. So there is exactly one dependency — the
# `[download]` extra adds `meds-extract-download` (httpx + tenacity), which the runner
# spawns to stage the raw data. MEDS-transforms, polars and hydra all arrive through it
# at the versions it fences; duplicating those pins here would only create drift.
#
# The floor is 0.7.0: this config is written in MEDS-Extract 0.7's single-file MESSY format, which
# earlier releases cannot read.
dependencies = [
    "meds-extract[download]>=0.7.0,<0.8",
]

[dependency-groups]
# `shfmt-py` bundles the `shfmt` binary that the `mdformat-shfmt` pre-commit hook shells out to;
# declaring it here keeps local and CI behavior in lock step. `pyyaml` is read by the e2e test to
# enumerate the config's event blocks. MESSY-synth (Python >= 3.12) is installed by its own CI
# workflow rather than here, so the dev group still resolves on Python 3.11.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pyyaml>=6.0",
    "shfmt-py==3.12.0.2",
]

[project.entry-points."MEDS_extract.pipelines"]
Zigong = "Zigong_MEDS:event_configs.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/ZIGONG_MEDS"
Issues = "https://github.com/rvandewater/ZIGONG_MEDS/issues"
Dataset = "https://physionet.org/content/icu-infection-zigong-fourth/1.1/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Zigong_MEDS*"]

[tool.setuptools.package-data]
Zigong_MEDS = ["*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
